<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>KIRA AI</title>
<link rel="icon" href="/icon.jpg">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
/* الألوان — عدّلها من هنا */
:root{--brand:#c8102e;--brand-deep:#7a0f24;--accent:#e0a94a;--bg:#fff7f5;--card:#fff;--ink:#2a1a1e;--mute:#8a6f75;--line:#f0dcdc;--bot:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#1a1214;--card:#251a1d;--ink:#f6e9ea;--mute:#b79ca1;--line:#3a2a2e;--bot:#251a1d}}
*{box-sizing:border-box}html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}
[hidden]{display:none!important}
.hero{display:flex;align-items:center;gap:12px;padding:12px 16px;color:#fff;background:linear-gradient(90deg,rgba(122,15,36,.92),rgba(200,16,46,.55)),url(/hero.jpg) center 22%/cover}
.logo{width:48px;height:48px;border-radius:13px;border:2px solid var(--accent);object-fit:cover}
.hero h1{margin:0;font-size:20px}.hero h1 span{color:var(--accent)}.hero p{margin:2px 0 0;font-size:12px;opacity:.9}.sp{flex:1}
.ghost{background:rgba(255,255,255,.15);color:#fff;border:1px solid rgba(255,255,255,.4);border-radius:10px;padding:6px 10px;font:inherit;font-size:12px;cursor:pointer}
#auth{max-width:380px;margin:28px auto;padding:0 16px}
.box{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px;display:flex;flex-direction:column;gap:10px}
.box h2{margin:0 0 4px;font-size:18px}
input,select,textarea{padding:11px 12px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);font:inherit;font-size:15px}
input:focus,select:focus,textarea:focus{outline:2px solid var(--brand)}
.btn{background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;border:0;border-radius:12px;padding:12px;font:inherit;font-weight:700;cursor:pointer}
.btn:disabled{opacity:.5}
.alt{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:12px;padding:11px;font:inherit;cursor:pointer}
.link{background:none;border:0;color:var(--brand);font:inherit;font-size:13px;cursor:pointer}
.err{color:var(--brand);font-size:13px;min-height:18px}
#app{display:flex;flex-direction:column;height:100%}
#app .hero{flex:none}
.controls{display:flex;flex-wrap:wrap;gap:8px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line)}
.controls select{flex:1;min-width:120px;font-size:14px;padding:8px}
.usage{font-size:12px;color:var(--mute);padding:6px 16px;text-align:center}
#chat{flex:1;overflow-y:auto;padding:16px;display:flex;flex-direction:column;gap:12px;max-width:820px;width:100%;margin:0 auto}
.msg{max-width:88%;padding:11px 14px;border-radius:16px;line-height:1.8;font-size:15px;white-space:pre-wrap;word-wrap:break-word}
.bot{align-self:flex-start;background:var(--bot);border:1px solid var(--line);border-top-right-radius:4px}
.me{align-self:flex-end;background:linear-gradient(135deg,var(--brand),var(--brand-deep));color:#fff;border-top-left-radius:4px}
.me img{max-width:100%;max-height:200px;border-radius:10px;display:block;margin-bottom:6px}
form{display:flex;gap:8px;padding:12px 16px;background:var(--card);border-top:1px solid var(--line);max-width:820px;width:100%;margin:0 auto;align-items:flex-end;padding-bottom:calc(12px + env(safe-area-inset-bottom,0px))}
textarea{flex:1;resize:none;max-height:120px}
.icon{background:var(--bg);border:1px solid var(--line);border-radius:12px;width:44px;height:44px;font-size:18px;cursor:pointer;flex:none}
.prev{position:relative;max-width:820px;margin:0 auto;width:100%;padding:6px 16px 0}
.prev img{height:56px;border-radius:8px;border:1px solid var(--line)}
.prev button{position:absolute;top:2px;background:var(--brand);color:#fff;border:0;border-radius:50%;width:20px;height:20px;cursor:pointer}
</style>
</head>
<body>
<!-- ===== شاشة الدخول ===== -->
<div id="auth" hidden>
  <div class="hero" style="border-radius:18px 18px 0 0">
    <img class="logo" src="/icon.jpg" alt=""><div><h1>KIRA <span>AI</span></h1><p>مساعدك الذكي للتعليم</p></div>
  </div>
  <div class="box" style="border-radius:0 0 18px 18px">
    <h2 id="atitle">تسجيل الدخول</h2>
    <button class="alt" id="g">المتابعة بحساب Google</button>
    <div style="text-align:center;color:var(--mute);font-size:12px">أو</div>
    <input id="em" type="email" placeholder="البريد الإلكتروني" autocomplete="email">
    <input id="pw" type="password" placeholder="كلمة المرور (8 أحرف على الأقل)" autocomplete="current-password" minlength="8">
    <input id="pw2" type="password" placeholder="تأكيد كلمة المرور" autocomplete="new-password" minlength="8" hidden>
    <div style="font-size:12px;color:var(--mute)">استخدم كلمة مرور طويلة وفريدة ولا تشاركها مع أي شخص.</div>
    <div class="err" id="err" role="status" aria-live="polite"></div>
    <button class="btn" id="go">دخول</button>
    <button class="link" id="sw">ليس لديك حساب؟ أنشئ حسابًا</button>
    <button class="link" id="fg">نسيت كلمة المرور؟</button>
  </div>
</div>

<!-- ===== التطبيق ===== -->
<div id="app" hidden>
  <div class="hero">
    <img class="logo" src="/icon.jpg" alt=""><div><h1>KIRA <span>AI</span></h1><p id="who"></p></div>
    <div class="sp"></div><a class="ghost" href="/code.html" style="text-decoration:none">KIRA CODE</a> <a class="ghost" href="https://studentbooks.moe.gov.eg/Books/" target="_blank" rel="noopener" style="text-decoration:none">كتب الوزارة</a> <a class="ghost" id="adm" href="/admin.html" hidden style="text-decoration:none">لوحة المطور</a> <button class="ghost" id="up">⭐ ترقية</button> <button class="ghost" id="out">خروج</button>
  </div>
  <div class="controls">
    <select id="level"></select><select id="subject"></select><select id="mode"></select><select id="acct" aria-label="نوع الحساب"><option value="student">طالب</option><option value="teacher">معلم</option></select>
  </div>
  <div id="ann" class="usage" hidden style="color:var(--ink);background:var(--card);border-bottom:1px solid var(--line)"></div>
  <div class="usage" id="usage"></div>
  <div id="chat"><div class="msg bot">أهلًا بك في KIRA AI 👋 اسألني عن أي درس، أو أرسل صورة المسألة وأنا أحلّلها.</div></div>
  <div class="prev" id="prev" hidden><img id="pimg" alt=""><button id="px" type="button">×</button></div>
  <form id="f">
    <input id="file" type="file" accept="image/*" hidden>
    <button class="icon" id="att" type="button" title="إرفاق صورة">📷</button>
    <textarea id="q" rows="1" placeholder="اكتب سؤالك..."></textarea>
    <button class="btn" id="send" type="submit" style="height:44px;padding:0 18px">إرسال</button>
  </form>
</div>

<div id="modal" hidden style="position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:9">
  <div class="box" style="max-width:520px;width:100%;max-height:90vh;overflow:auto">
    <div style="display:flex;align-items:center"><h2 style="flex:1">اختر باقتك</h2><button class="link" id="mx">إغلاق</button></div>
    <div id="pp" style="display:flex;gap:6px"></div><div id="pl" style="display:flex;flex-direction:column;gap:8px"></div>
    <div id="pn" style="font-size:13px;color:var(--mute);white-space:pre-wrap"></div>
  </div>
</div>
<script>
/* ===== إعدادات يمكنك تعديلها ===== */
const LEVELS=["رياض الأطفال","المرحلة الابتدائية","المرحلة الإعدادية","المرحلة الثانوية","الجامعة"];
const SUBJECTS=["الرياضيات","العلوم","الفيزياء","الكيمياء","الأحياء","البرمجة وعلوم الحاسب","الذكاء الاصطناعي","اللغة العربية","اللغة الإنجليزية","اللغات الأجنبية","التاريخ","الجغرافيا","الدراسات الاجتماعية","الفلسفة والمنطق","الاقتصاد وإدارة الأعمال","المحاسبة","القانون","الطب والتمريض","الهندسة","الفنون والتصميم","مادة أخرى — اكتبها في السؤال"];
const MODES={direct:"حلّ مباشر",teacher:"وضع المعلم (خطوة بخطوة)",quiz:"اختبرني"};
const MSG={messages:"انتهت رسائلك لهذا اليوم. ارتقِ لباقة أعلى للمزيد.",images:"انتهت صورك لهذا اليوم. ارتقِ لباقة أعلى للمزيد."};

const $=id=>document.getElementById(id);
const fill=(s,a,d)=>a.forEach(v=>{const o=document.createElement('option');o.textContent=v;if(v===d)o.selected=1;s.appendChild(o)});
fill($('level'),LEVELS,"المرحلة الثانوية");fill($('subject'),SUBJECTS);
Object.entries(MODES).forEach(([k,v])=>{const o=document.createElement('option');o.value=k;o.textContent=v;$('mode').appendChild(o)});

let sb,token=null,signup=false,busy=false,pending=null;const hist=[];

(async()=>{
  const c=await (await fetch('/api/config')).json();
  sb=supabase.createClient(c.url,c.key);
  sb.auth.onAuthStateChange((_e,s)=>{token=s?.access_token||null;$('auth').hidden=!!s;$('app').hidden=!s;if(s)loadMe()});
})();

/* ===== الدخول ===== */
const err=t=>$('err').textContent=t;
$('sw').onclick=()=>{signup=!signup;$('atitle').textContent=signup?'إنشاء حساب جديد':'تسجيل الدخول';$('go').textContent=signup?'إنشاء الحساب':'دخول';$('sw').textContent=signup?'لديك حساب؟ سجّل الدخول':'ليس لديك حساب؟ أنشئ حسابًا';$('pw2').hidden=!signup;$('pw').autocomplete=signup?'new-password':'current-password';$('fg').hidden=signup;err('')};
$('go').onclick=async()=>{
  err('');const email=$('em').value.trim(),password=$('pw').value;
  if(!email||!$('em').checkValidity())return err('أدخل بريدًا إلكترونيًا صحيحًا.');
  if(password.length<8)return err('كلمة المرور يجب ألا تقل عن 8 أحرف.');
  if(signup&&password!==$('pw2').value)return err('كلمتا المرور غير متطابقتين.');
  $('go').disabled=true;$('go').textContent='جارٍ التحقق…';
  try{
    const r=signup?await sb.auth.signUp({email,password,options:{emailRedirectTo:location.origin}}):await sb.auth.signInWithPassword({email,password});
    if(r.error){const m=r.error.message||'';return err(/invalid login credentials/i.test(m)?'البريد أو كلمة المرور غير صحيحة.':/already registered|user already registered/i.test(m)?'هذا البريد مسجل بالفعل؛ سجّل الدخول بدلًا من إنشاء حساب جديد.':m)}
    if(signup&&!r.data.session)err('تم إنشاء الطلب. افتح بريدك واضغط رابط التأكيد ثم سجّل الدخول.');
    else if(signup)err('تم إنشاء حسابك بنجاح.');
  }catch(e){err('تعذر الاتصال بالخدمة. تحقق من الإنترنت وإعدادات Supabase ثم حاول مجددًا.');}
  finally{$('go').disabled=false;$('go').textContent=signup?'إنشاء الحساب':'دخول'}
};
$('g').onclick=()=>sb.auth.signInWithOAuth({provider:'google',options:{redirectTo:location.origin}});
$('fg').onclick=async()=>{const email=$('em').value.trim();if(!email||!$('em').checkValidity())return err('اكتب بريدًا إلكترونيًا صحيحًا أولًا.');
  try{const r=await sb.auth.resetPasswordForEmail(email,{redirectTo:location.origin});err(r.error?'تعذر إرسال الرابط. تحقق من البريد وإعدادات SMTP في Supabase.':'إذا كان البريد مسجلًا، فسيصلك رابط إعادة تعيين كلمة المرور.')}catch{err('تعذر الاتصال بالخدمة. حاول مجددًا.')}};
$('out').onclick=()=>{sb.auth.signOut();hist.length=0};

/* ===== المعلومات والحدود ===== */
async function loadMe(){
  try{const r=await fetch('/api/me',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const m=await r.json();
  $('who').textContent=m.email;$('adm').hidden=m.role!=='admin';$('acct').value=m.account_type||'student';loadAnn();$('usage').textContent=`الباقة: ${m.plan} — رسائل متبقية اليوم: ${Math.max(m.messages_left,0)} — صور: ${Math.max(m.images_left,0)}`}catch{}
}

/* ===== الصور ===== */
$('att').onclick=()=>$('file').click();
$('file').onchange=e=>{const f=e.target.files[0];e.target.value='';if(!f)return;
  const img=new Image();img.onload=()=>{const s=Math.min(1,1280/Math.max(img.width,img.height)),c=document.createElement('canvas');
    c.width=img.width*s;c.height=img.height*s;c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const url=c.toDataURL('image/jpeg',.85);pending={media_type:'image/jpeg',data:url.split(',')[1],url};
    $('pimg').src=url;$('prev').hidden=false};img.src=URL.createObjectURL(f)};
$('px').onclick=()=>{pending=null;$('prev').hidden=true};

/* ===== الشات ===== */
function add(cls,txt,img){const d=document.createElement('div');d.className='msg '+cls;
  if(img){const i=document.createElement('img');i.src=img;d.appendChild(i)}
  d.appendChild(document.createTextNode(txt));$('chat').appendChild(d);$('chat').scrollTop=1e9;return d}
$('f').onsubmit=async e=>{
  e.preventDefault();const text=$('q').value.trim();if(busy||(!text&&!pending))return;
  busy=true;$('send').disabled=true;$('q').value='';
  const image=pending;pending=null;$('prev').hidden=true;
  add('me',text,image?.url);hist.push({role:'user',content:text});
  const out=add('bot','...');let acc='';
  try{
    const r=await fetch('/api/chat',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},
      body:JSON.stringify({messages:hist,level:$('level').value,subject:$('subject').value,mode:$('mode').value,
        image:image?{media_type:image.media_type,data:image.data}:null})});
    if(!r.ok){hist.pop();const j=await r.json().catch(()=>({}));
      out.textContent=r.status===429?(MSG[j.detail]||'وصلت للحد اليومي.'):r.status===401?'انتهت الجلسة، سجّل الدخول من جديد.':r.status===413?'الصورة كبيرة جدًا.':r.status===503?(j.detail||'المنصة تحت الصيانة.'):r.status===403?'هذا الحساب موقوف.':'حدث خطأ، حاول مرة أخرى.';
      if(r.status===401)sb.auth.signOut();return}
    const rd=r.body.getReader(),dec=new TextDecoder();
    for(;;){const {done,value}=await rd.read();if(done)break;acc+=dec.decode(value,{stream:true});out.textContent=acc;$('chat').scrollTop=1e9}
    hist.push({role:'assistant',content:acc});
  }catch{hist.pop();out.textContent='تعذّر الاتصال بالخادم.'}
  finally{busy=false;$('send').disabled=false;loadMe()}
};
$('q').onkeydown=e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();$('f').requestSubmit()}};

/* ===== الترقية والدفع ===== */
const PER={weekly:"أسبوعي",monthly:"شهري",yearly:"سنوي"};let plansList=[],per='monthly';
function drawPlans(){
  $('pp').innerHTML=Object.entries(PER).map(([k,v])=>`<button class="${k===per?'btn':'alt'}" data-per="${k}" style="flex:1;padding:8px">${v}</button>`).join('');
  $('pl').innerHTML=plansList.filter(p=>(p.kind||'s')===($('acct').value==='teacher'?'t':'s')).map(p=>{const price=p['price_'+per];return `<div style="border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;align-items:center;gap:10px">
    <div style="flex:1"><b>${p.name}</b><div style="font-size:12px;color:var(--mute)">${p.daily_messages} رسالة و${p.daily_images} صور يوميًا</div></div>
    ${p.id==='free'?'<span style="color:var(--mute)">مجانية</span>':price>0?`<button class="btn" data-buy="${p.id}">${price} / ${PER[per]}</button>`:'<span style="color:var(--mute)">قريبًا</span>'}</div>`}).join('')}
$('up').onclick=async()=>{plansList=await (await fetch('/api/plans')).json();$('pn').textContent='';drawPlans();$('modal').hidden=false};
$('mx').onclick=()=>$('modal').hidden=true;
$('pp').onclick=e=>{if(e.target.dataset.per){per=e.target.dataset.per;drawPlans()}};
$('pl').onclick=async e=>{const id=e.target.dataset.buy;if(!id)return;
  const r=await fetch('/api/checkout',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({plan_id:id,period:per})});
  if(!r.ok)return $('pn').textContent='تعذّر إنشاء الطلب.';
  const j=await r.json();if(j.url)window.open(j.url,'_blank');renderPay(j);return;
  $('pn').textContent=`رقم طلبك: ${j.payment_id}\nالمبلغ: ${j.amount}\n${j.note||''}\nبعد الدفع يُفعَّل اشتراكك تلقائيًا أو بعد تأكيد الإدارة.`};

$('acct').onchange=async()=>{await fetch('/api/profile',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({account_type:$('acct').value})});loadMe()};
async function loadAnn(){try{const r=await fetch('/api/announcements',{headers:{Authorization:'Bearer '+token}});if(!r.ok)return;const a=await r.json();
 let seen=[];try{seen=JSON.parse(localStorage.getItem('seenAnn')||'[]')}catch{}const n=a.filter(x=>!seen.includes(x.id));$('ann').hidden=!n.length;$('ann').textContent='';
 n.forEach(x=>{const d=document.createElement('div');d.textContent='📢 '+x.text;$('ann').appendChild(d)});
 const b=document.createElement('button');b.className='alt';b.textContent='حسنًا';b.onclick=()=>{try{localStorage.setItem('seenAnn',JSON.stringify(a.map(x=>x.id)))}catch{}$('ann').hidden=true};$('ann').appendChild(b)}catch{}}
function renderPay(j){const pn=$('pn');pn.textContent='';const add=t=>{const d=document.createElement('div');d.textContent=t;pn.appendChild(d)};
 add('المبلغ: '+j.amount+' جنيه');
 if(j.vcash){add('حوّل على فودافون كاش:');const row=document.createElement('div');row.dir='ltr';const b=document.createElement('b');b.textContent=j.vcash;b.style.fontSize='20px';
  const cb=document.createElement('button');cb.className='btn';cb.textContent='نسخ';cb.style.marginInlineStart='8px';
  cb.onclick=()=>{try{navigator.clipboard.writeText(j.vcash).then(()=>cb.textContent='تم النسخ ✓')}catch{}};row.append(b,cb);pn.appendChild(row)}
 if(j.note)add(j.note);
 const f=document.createElement('input');f.placeholder='رقم المحفظة التي حوّلت منها';f.dir='ltr';
 const t=document.createElement('input');t.placeholder='رقم العملية من رسالة التأكيد';t.dir='ltr';
 const s=document.createElement('button');s.className='btn';s.textContent='تم التحويل، أرسل للمراجعة';
 s.onclick=async()=>{const r=await fetch('/api/payments/'+j.payment_id+'/proof',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+token},body:JSON.stringify({from_number:f.value,tx:t.value})});add(r.ok?'✅ وصل طلبك وسيُفعَّل اشتراكك بعد تأكيد المطور.':'تعذّر الإرسال.')};
 pn.append(f,t,s)}
</script>
</body>
</html>
