<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KIRA CODE</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<style>
:root{--brand:#c8102e;--deep:#7a0f24;--bg:#fff7f5;--card:#fff;--ink:#2a1a1e;--mute:#8a6f75;--line:#f0dcdc}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,"Noto Sans Arabic",Arial,sans-serif}header{background:linear-gradient(120deg,var(--deep),var(--brand));color:#fff;padding:18px 16px;display:flex;align-items:center;gap:12px}header img{width:48px;height:48px;border-radius:13px;border:2px solid #e0a94a}header h1{margin:0;font-size:22px}header p{margin:3px 0 0;font-size:12px;opacity:.9}.back{margin-inline-start:auto;color:#fff;text-decoration:none;border:1px solid #ffffff66;border-radius:10px;padding:8px 11px;font-size:13px}main{max-width:900px;margin:auto;padding:18px 16px}.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:14px}h2{margin:0 0 8px;font-size:18px}.hint{color:var(--mute);font-size:13px;line-height:1.7}.drop{border:2px dashed var(--line);border-radius:14px;padding:24px;text-align:center;margin-top:12px;cursor:pointer}.drop:hover{border-color:var(--brand)}input,textarea{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit;margin-top:8px}textarea{min-height:90px;resize:vertical}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:12px}.btn{background:linear-gradient(135deg,var(--brand),var(--deep));border:0;border-radius:11px;color:#fff;padding:11px 16px;font:inherit;font-weight:700;cursor:pointer}.btn:disabled{opacity:.5}.file{font-weight:700;color:var(--brand)}#out{white-space:pre-wrap;line-height:1.8;font-size:14px;overflow:auto;max-height:650px}.status{font-size:13px;color:var(--mute)}code{direction:ltr;display:inline-block}
</style></head>
<body>
<header><img src="/icon.jpg" alt=""><div><h1>KIRA <span>CODE</span></h1><p>ارفع مشروعك، افهمه، واكتشف أخطاءه</p></div><a class="back" href="/">العودة إلى KIRA</a></header>
<main>
<section class="card"><h2>تحليل مشروع برمجي</h2><div class="hint">ارفع ملف ZIP أو ملف كود. ستتم قراءة الملفات النصية فقط داخل الذاكرة، ولن يتم تشغيل أي كود مرفوع على الخادم.</div><label class="drop" for="file"><div>اضغط لاختيار المشروع</div><div class="file" id="name">لم يتم اختيار ملف</div></label><input id="file" type="file" accept=".zip,.py,.js,.jsx,.ts,.tsx,.html,.css,.json,.md,.sql,.java,.cpp,.c,.cs,.php,.vue,.svelte" hidden><label>ماذا تريد من KIRA CODE؟<textarea id="task">اشرح المشروع، وضّح بنية الملفات، اكتشف الأخطاء والمخاطر، واقترح تحسينات عملية مع كود جاهز عند الحاجة.</textarea></label><div class="row"><button class="btn" id="go">تحليل المشروع</button><span class="status" id="status"></span></div></section>
<section class="card" id="result" hidden><h2>نتيجة التحليل</h2><div id="out"></div></section>
</main>
<script>
let token=null,file=null;const $=id=>document.getElementById(id);
(async()=>{const c=await (await fetch('/api/config')).json();if(window.supabase){const sb=supabase.createClient(c.url,c.key);const s=(await sb.auth.getSession()).data.session;if(s)token=s.access_token;}if(!token){$('status').textContent='يجب تسجيل الدخول من الصفحة الرئيسية أولًا.';$('go').disabled=true;}})();
$('file').onchange=e=>{file=e.target.files[0];$('name').textContent=file?`${file.name} — ${(file.size/1024/1024).toFixed(2)} MB`:'لم يتم اختيار ملف'};
$('go').onclick=async()=>{if(!file)return $('status').textContent='اختر مشروعًا أولًا.';$('go').disabled=true;$('status').textContent='جارٍ قراءة الملفات وتحليل المشروع...';$('result').hidden=false;$('out').textContent='';const fd=new FormData();fd.append('file',file);fd.append('task',$('task').value);try{const r=await fetch('/api/code/analyze',{method:'POST',headers:{Authorization:'Bearer '+token},body:fd});if(!r.ok){const j=await r.json().catch(()=>({}));throw Error(j.detail||'تعذر التحليل');}const rd=r.body.getReader(),dec=new TextDecoder();for(;;){const x=await rd.read();if(x.done)break;$('out').textContent+=dec.decode(x.value,{stream:true});$('out').scrollTop=$('out').scrollHeight;}$('status').textContent='اكتمل التحليل.'}catch(e){$('status').textContent=e.message}finally{$('go').disabled=false}};
</script>
</body></html>
